# nginx da página Galaxy Starter (usado pelo Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: CSS/JS/SVG/HTML chegam ~4x menores
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML sempre revalida (é ele que aponta para as versões ?v= do CSS/JS)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS e JS: versionados por ?v= no index.html. Ao mudar, suba o número.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Fonte: nunca muda
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagens
    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
